name: Refresh Working Proxies

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run proxy tester
        run: python3 update_pac.py
      - name: Save updated proxy.pac
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add proxy.pac
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live proxies" && git push)
